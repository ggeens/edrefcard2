<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in - EDRefCard</title>
    <style>
        :root { --ed-orange: #ff8c00; --bg: #0a0e14; --card: #151c27; --line: rgba(255,140,0,0.25); --text: #e8eaed; --muted: #9aa0a6; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); }
        .box { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 2rem; width: 340px; }
        h1 { font-size: 1.15rem; margin: 0 0 0.25rem; color: var(--ed-orange); }
        p.sub { margin: 0 0 1.25rem; color: var(--muted); font-size: 0.85rem; }
        label { display: block; margin: 0.75rem 0 0.3rem; font-size: 0.85rem; color: var(--muted); }
        input { width: 100%; padding: 0.55rem 0.7rem; background: rgba(0,0,0,0.35); border: 1px solid var(--line);
                border-radius: 5px; color: var(--text); font-size: 0.95rem; }
        input:focus { outline: none; border-color: var(--ed-orange); }
        button { margin-top: 1.25rem; width: 100%; padding: 0.6rem; background: var(--ed-orange); color: #000;
                 border: none; border-radius: 5px; font-weight: 700; font-size: 0.95rem; cursor: pointer; }
        button:hover { background: #ffb347; }
        .err { background: rgba(220,53,69,0.15); border: 1px solid #dc3545; color: #ff8a94;
               padding: 0.6rem 0.8rem; border-radius: 5px; font-size: 0.85rem; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <form class="box" method="post" action="{{ url_for('admin.login') }}">
        <h1>🛠️ EDRefCard</h1>
        <p class="sub">Sign in to the controller-mapping panel.</p>
        {% if error %}<div class="err">{{ error }}</div>{% endif %}
        <input type="hidden" name="next" value="{{ next }}">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" autofocus required>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
    </form>
</body>
</html>
